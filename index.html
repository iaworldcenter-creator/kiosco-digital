<!DOCTYPE html>

<html lang="es">
<head>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
        updateAddressDisplay();
        updateCartBadge();
        
        // Sincronizar el bot?n activo de paginaci?n inicial
        const btns = document.querySelectorAll('.pagination-btn');
        if (btns.length >= currentPage) {
            btns.forEach(b => {
                b.className = "pagination-btn px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-blue-600 hover:border-blue-500 hover:text-white transition font-bold text-sm shadow-md cursor-pointer active:scale-95";
            });
            btns[currentPage - 1].className = "pagination-btn px-4 py-2.5 rounded-lg bg-blue-600 border border-blue-500 text-white font-bold text-sm shadow-md shadow-blue-600/30 cursor-pointer transition active:scale-95";
        }
        renderProductsGrid();
        
        // Dynamic video loading for desktop only to save 6MB on mobile
        if (window.innerWidth > 768) {
            const vl = document.getElementById("video-container-left");
            if (vl) {
                vl.innerHTML = `<video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover object-tech-bazar pointer-events-none">
                    <source src="assets/img/Revistas/Tiger_reading_book_at_desk_202608080710.mp4" type="video/mp4" />
                </video>`;
            }
            const vr = document.getElementById("video-container-right");
            if (vr) {
                vr.innerHTML = `<video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover object-tiger-bazar pointer-events-none">
                    <source src="assets/img/Revistas/Tiger_reading_fashion_magazine_202608080710.mp4" type="video/mp4" />
                </video>`;
            }
        }
    });
        }
    }
    
    function filterByCategory(category, event) {
        if (event) event.preventDefault();
        const targetPage = CATEGORY_TO_PAGE[category] || 1;
        const btns = document.querySelectorAll('.pagination-btn');
        const targetBtn = btns[targetPage - 1];
        changePage(targetPage, targetBtn);
    }

    function filterByDept(dept) {
        filterByCategory(dept);
    }

    function renderProductsGrid(searchFilter = "") {
        const grid = document.getElementById("pc-productos-grid");
        const statusEl = document.getElementById("pagination-status");
        if (!grid) return;
        grid.innerHTML = "";

        const currentCategory = PAGE_TO_CATEGORY[currentPage];
        let pageProducts = productCatalog.filter(p => p.categoria === currentCategory);

        if (searchFilter) {
            pageProducts = pageProducts.filter(p => 
                p.nombre.toLowerCase().includes(searchFilter.toLowerCase()) ||
                p.descripcion.toLowerCase().includes(searchFilter.toLowerCase())
            );
        }

        if (statusEl) {
            statusEl.textContent = `Mostrando p?gina ${currentPage} de 3 • ${CATEGORY_NAMES[currentCategory]} (${pageProducts.length} productos)`;
        }

        if (pageProducts.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-12 flex flex-col items-center justify-center text-slate-500">
                <i class="fa-solid fa-magnifying-glass text-4xl mb-3 text-slate-600"></i>
                <p class="font-bold text-sm uppercase tracking-wider">No se encontraron productos</p>
                <p class="text-xs mt-1 text-slate-600">Intenta buscando otro artículo o palabra clave</p>
            </div>`;
            return;
        }

        pageProducts.forEach((p) => {
            const card = document.createElement("div");
            card.className = "bg-slate-950/80 border border-slate-800/80 p-3.5 rounded-2xl flex flex-col justify-between h-[320px] md:h-[360px] shadow-lg hover:border-blue-500 hover:shadow-blue-900/10 transition duration-300 relative group cursor-pointer";
            
            card.onclick = (e) => {
                if (!e.target.closest('button') && !e.target.closest('a')) {
                    window.location.href = `https://iaworldcenter-creator.github.io/mi-puesto-bazar/producto.html?sku=${p.sku}`;
                }
            };

            card.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div class="w-full h-32 md:h-40 overflow-hidden rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center p-1.5">
                        <img loading="lazy" src="https://iaworldcenter-creator.github.io/mi-puesto-bazar/${p.imagen}" alt="${p.nombre}" class="w-full h-full object-contain p-2 bg-slate-950 group-hover:scale-103 transition duration-300" width="150" height="150" onerror="this.onerror=null;this.parentNode.innerHTML='<div class=&quot;flex flex-col items-center justify-center w-full h-full text-slate-500&quot;><i class=&quot;fa-solid fa-box-open text-3xl mb-2&quot;></i><span class=&quot;text-[9px] font-mono uppercase tracking-wider font-bold&quot;>Imagen Próximamente</span></div>';">
                    </div>
                    <div class="flex flex-col gap-1 mt-1">
                        <div class="flex justify-between items-center gap-1">
                            <span class="text-[9px] font-mono font-bold text-slate-500">${p.sku}</span>
                            <span class="text-[9px] font-bold px-1.5 py-0.2 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">Bazar</span>
                        </div>
                        <h4 class="text-xs font-black text-white leading-tight line-clamp-2 h-[32px] overflow-hidden hover:text-amber-400 transition">${p.nombre}</h4>
                        <p class="text-[9px] text-slate-500 line-clamp-2 leading-snug h-[28px] overflow-hidden">${p.descripcion}</p>
                    </div>
                </div>
                <div class="flex flex-col gap-2 mt-4 pt-2.5 border-t border-slate-800/80">
                    <div class="flex items-baseline gap-1.5">
                        <span class="text-sm font-black text-white">$${p.precio} MXN</span>
                        ${p.precio_original ? `<span class="text-[10px] text-slate-500 line-through">$${p.precio_original}</span>` : ''}
                    </div>
                    <button onclick="addToCart('${p.sku}'); event.stopPropagation();" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded-full text-[10px] text-center shadow-sm border border-amber-600 transition active:scale-97 cursor-pointer flex items-center justify-center gap-1 uppercase tracking-wider w-full">
                    Compra
                </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Touch Swipe Gestures
    const productsGrid = document.getElementById("pc-productos-grid");
    if (productsGrid) {
        let touchStartX = 0;
        let touchEndX = 0;
        
        productsGrid.addEventListener("touchstart", (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        productsGrid.addEventListener("touchend", (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const swipeThreshold = 60;
            if (touchStartX - touchEndX > swipeThreshold) {
                // Swiped Left -> Next
                if (currentPage < totalPages) {
                    const btns = document.querySelectorAll('.pagination-btn');
                    changePage(currentPage + 1, btns[currentPage]);
                }
            } else if (touchEndX - touchStartX > swipeThreshold) {
                // Swiped Right -> Prev
                if (currentPage > 1) {
                    const btns = document.querySelectorAll('.pagination-btn');
                    changePage(currentPage - 1, btns[currentPage - 2]);
                }
            }
        }
    }

    // Real-time Search Listener
    const searchInput = document.getElementById('siteSearch');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            renderProductsGrid(e.target.value.trim());
        });
        const searchForm = searchInput.closest('form');
        if (searchForm) {
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
            });
        }
    }

    // Boot up
    window.addEventListener('load', () => {
        updateAddressDisplay();
        updateCartBadge();
        
        // Sincronizar el bot?n activo de paginaci?n inicial
        const btns = document.querySelectorAll('.pagination-btn');
        if (btns.length >= currentPage) {
            btns.forEach(b => {
                b.className = "pagination-btn px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-blue-600 hover:border-blue-500 hover:text-white transition font-bold text-sm shadow-md cursor-pointer active:scale-95";
            });
            btns[currentPage - 1].className = "pagination-btn px-4 py-2.5 rounded-lg bg-blue-600 border border-blue-500 text-white font-bold text-sm shadow-md shadow-blue-600/30 cursor-pointer transition active:scale-95";
        }
        renderProductsGrid();
        
        // Dynamic video loading for desktop only to save 6MB on mobile
        if (window.innerWidth > 768) {
            const vl = document.getElementById("video-container-left");
            if (vl) {
                vl.innerHTML = `<video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover object-tech-bazar pointer-events-none">
                    <source src="assets/img/Revistas/Tiger_reading_book_at_desk_202608080710.mp4" type="video/mp4" />
                </video>`;
            }
            const vr = document.getElementById("video-container-right");
            if (vr) {
                vr.innerHTML = `<video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover object-tiger-bazar pointer-events-none">
                    <source src="assets/img/Revistas/Tiger_reading_fashion_magazine_202608080710.mp4" type="video/mp4" />
                </video>`;
            }
        }
    });
</script>

</body>
</html>
